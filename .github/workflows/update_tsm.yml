name: Update TSM prices

on:
  schedule:
    # каждые 3 часа (UTC). GitHub может задержать запуск на несколько минут.
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsm-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build static dashboard (TSM Public Data -> docs/index.html)
        run: python build_static_site.py --no-push

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "Цены не изменились — коммит не нужен."
          else
            git commit -m "Update TSM prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
